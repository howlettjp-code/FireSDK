[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-sdk"
version = "1.0.1"
description = "Python SDK for the Fire AI Inference API (L1 chat/image, L2 workflows, v2 multi-agent flows)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://prosaga.net"
"Fire API" = "https://fire.prosaga.net"
"API Reference" = "https://fire.prosaga.net/v1/capabilities"
Repository = "https://github.com/howlettjp-code/FireSDK"
Issues = "https://github.com/howlettjp-code/FireSDK/issues"

[project.optional-dependencies]
# Tests use only unittest.mock (stdlib) — pytest is optional, it just runs
# the same unittest.TestCase classes with nicer output if you have it.
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["fire_sdk*"]
