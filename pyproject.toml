[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-sdk"
version = "0.1.0"
description = "Python SDK for the Fire AI Inference API (v1 chat + v2 multi-agent flows)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
# Tests use only unittest.mock (stdlib) — pytest is optional, it just runs
# the same unittest.TestCase classes with nicer output if you have it.
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["fire_sdk*"]
